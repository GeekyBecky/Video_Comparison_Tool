name: Video Quality Tests
on:
  workflow_dispatch:
jobs:
  run-video-quality-tests:
    name: Run Video Quality Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: pr-branch
      - name: Checkout Base Branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base-branch
      - name: Upload HTML Comparison Page
        uses: actions/upload-artifact@v4
        with:
          name: video-comparison-page
          path: ./Video_Comparison_Tool/index.html
      - name: Deploy to GitHub Pages
        if: github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: pr-diffs/${{ github.event.pull_request.number }}

      - name: Comment PR with Link to Diff Report
        uses: mshick/add-pr-comment@v2
        with:
          message: "📊 [View the Evaluation Diff Report](https://yourusername.github.io/your-repo/pr-diffs/${{ github.event.pull_request.number }}/diff_report.html)"